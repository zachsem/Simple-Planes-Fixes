buildscript {
    repositories {
        maven { url = 'https://maven.blamejared.com' }
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = '1.1.2'
group = 'com.zachsem.simpleplanesfixes'
archivesBaseName = 'SimplePlanesFixes-1.12.2'

sourceCompatibility = targetCompatibility = '1.8'

minecraft {
    version = '1.12.2-14.23.5.2859'
    runDir = 'run'
    mappings = 'stable_39'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': '1.12.2'
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}


dependencies {
    // Compile against the stable JEI 1.12 API. JEI remains optional at runtime.
    deobfCompile "mezz.jei:jei_1.12.2:4.16.1.302:api"
}
